name: FourierAttention  # project_name
dataset_name: 'WV3'  # only support 'GF2', 'QB', 'WV3', 'WV2', 'CAVE_x4', 'CAVE_x8', 'HARVARD_x4', 'HARVARD_x8' now
model_name: 'MSL_RIJAN_PD'  # only support 'GuidedNet', 'RIJAN', 'MSL_RIJAN_PD' now
#model_name: 'GuidedNet'
#model_name: 'RIJAN'
#max_step: [3, 3, 3]
max_step: [5, 5, 5]
pool_size: [2, 4, 8]
gate_channel: [32, 16, 8]
#dynamic: True
dynamic: False
recursive: True
gate_method: "gate"
gate_input: "all"
MRD: 5

# epoch_num: 500
epoch_num: 1000
batch_size: 32
#batch_size: 16
base_lr: 5e-4
# base_lr: 5e-5
#base_lr: 3e-4
# parameters for scheduler lr
#gamma: 0.1
gamma: 0.5
step_size: 250

data_path: './data_files'
# tensorboard file path
log_dir: './logs'
tb_log_path: './tb_logs'
weights_path: './weights/'
results_path: './results/'
gpu_list: [0]
workers: 0
save_epoch: 25
#resume:
# path to the latest check point (default - none)
#resume_log_id:
# the id of resumed run if you want to continue log
#start_epoch: 0

test_mode: 'reduced'
#test_mode: 'full'

